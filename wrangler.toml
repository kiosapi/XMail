name = "xmail"
main = "src/index.ts"
compatibility_date = "2025-06-01"

workers_dev = false

# ---- D1 Database ----
[[d1_databases]]
binding = "DB"
database_name = "xmail-db"
database_id = "c4b41c8b-2269-44bf-936d-0cc83ff937cd"

# ---- Email Worker ----
[email]
action = "process"

# ---- Cron Triggers (auto-expiry) ----
[triggers]
crons = ["0 * * * *"]

# ---- Custom domain ----
[[routes]]
pattern = "mail.kilo.web.id"
custom_domain = true

# ---- Environment variables ----
[vars]
APP_NAME = "XMail"
# Comma-separated list of mail domains (also configurable via /api/domains)
MAIL_DOMAIN = "kilo.web.id,asuw.fun"
WEB_HOST = "mail.kilo.web.id"
AUTO_EXPIRY_HOURS = "24"
MAX_MESSAGES_PER_INBOX = "100"
# Secrets (set via wrangler secret put):
# API_KEYS  — comma-separated, empty = auth disabled
# ADMIN_KEYS — comma-separated, for domain management
# TG_BOT_TOKEN — Telegram bot token

# ---- Static assets ----
[assets]
directory = "./src/web"

# ---- Observability ----
[observability]
enabled = true
