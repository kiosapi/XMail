<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>XMail</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%230A84FF'/%3E%3Cstop offset='100%25' style='stop-color:%230052CC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M14 22h36a2 2 0 0 1 2 2v20a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V24a2 2 0 0 1 2-2z' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M12 24l20 14L52 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- Large title navigation bar -->
      <nav class="nav-bar">
        <div class="nav-actions-left">
          <button id="statsBtn" class="nav-text-btn" aria-label="Statistics">Stats</button>
        </div>
        <div class="nav-actions-right">
          <button id="themeToggle" class="nav-icon-btn" aria-label="Toggle theme">
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </button>
        </div>
      </nav>

      <!-- Large title -->
      <div class="large-title">
        <h1>XMail</h1>
        <p id="appSubtitle">Disposable inbox</p>
      </div>

      <!-- Main content -->
      <main class="content">
        <!-- Current inbox - grouped table -->
        <div class="section-label">CURRENT INBOX</div>
        <div class="grouped-table">
          <div class="table-row">
            <div class="table-cell">
              <svg class="cell-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 6 10-6"/></svg>
              <select id="inboxSelect" class="cell-select"></select>
              <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </div>
            <button id="copyBtn" class="cell-action" aria-label="Copy address">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>

        <!-- Toolbar - iOS style -->
        <div class="toolbar">
          <button id="newBtn" class="toolbar-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="bulkBtn" class="toolbar-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
          </button>
          <button id="settingsBtn" class="toolbar-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <div class="toolbar-divider"></div>
          <button id="refreshBtn" class="toolbar-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
          </button>
          <button id="deleteBtn" class="toolbar-btn danger">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
        </div>

        <!-- Expandable: New inbox -->
        <div class="expandable hidden" id="newBox">
          <div class="section-label">NEW INBOX</div>
          <div class="grouped-table">
            <div class="table-row">
              <div class="table-cell stacked">
                <label>Username</label>
                <input id="localPartInput" placeholder="Custom or leave blank" />
              </div>
            </div>
            <div class="table-row">
              <div class="table-cell">
                <label>Domain</label>
                <select id="domainSelect" class="cell-select domain-select"></select>
                <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </div>
            </div>
          </div>
          <div class="button-row">
            <button id="createRandomBtn" class="btn-secondary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
              Random
            </button>
            <button id="createCustomBtn" class="btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/></svg>
              Create
            </button>
          </div>
        </div>

        <!-- Expandable: Bulk -->
        <div class="expandable hidden" id="bulkBox">
          <div class="section-label">BULK CREATE</div>
          <div class="grouped-table">
            <div class="table-row">
              <div class="table-cell">
                <label>Count</label>
                <input id="bulkCount" type="number" value="5" min="1" max="100" class="cell-input" />
              </div>
            </div>
          </div>
          <div class="button-row">
            <button id="bulkExportBtn" class="btn-secondary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Export
            </button>
            <button id="bulkCreateBtn" class="btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
              Create Bulk
            </button>
          </div>
          <textarea id="bulkResult" class="bulk-result hidden" readonly placeholder="Addresses will appear here..."></textarea>
        </div>

        <!-- Expandable: Settings -->
        <div class="expandable hidden" id="settingsBox">
          <div class="section-label">INBOX SETTINGS</div>
          <div class="grouped-table">
            <div class="table-row">
              <div class="table-cell stacked">
                <label>Webhook URL</label>
                <input id="webhookInput" placeholder="https://example.com/webhook" />
              </div>
            </div>
            <div class="table-row">
              <div class="table-cell stacked">
                <label>Telegram Chat ID</label>
                <input id="telegramInput" placeholder="123456789" />
              </div>
            </div>
          </div>
          <div class="button-row">
            <button id="saveSettingsBtn" class="btn-primary full">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Save Settings
            </button>
          </div>
          <p class="settings-hint">Webhook and Telegram fire on every incoming email. Set TG_BOT_TOKEN as a Worker secret.</p>
        </div>

        <!-- Expandable: Stats -->
        <div class="expandable hidden" id="statsBox">
          <div class="section-label">STATISTICS</div>
          <div id="statsContent" class="stats-content">Loading...</div>
        </div>

        <!-- Messages -->
        <div class="section-header">
          <span id="messageCount">0 messages</span>
        </div>
        <div class="grouped-table message-table">
          <div id="messageList" class="message-list"></div>
        </div>
      </main>

      <footer class="footer">
        <span>XMail v1.0</span>
      </footer>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Bottom sheet modal -->
    <div class="sheet-overlay hidden" id="messageModal">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h3 id="modalSubject"></h3>
          <button id="modalClose" class="nav-icon-btn" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="sheet-meta">
          <div class="meta-row">
            <span class="meta-label">From</span>
            <span id="modalFrom" class="meta-value"></span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Date</span>
            <span id="modalDate" class="meta-value"></span>
          </div>
          <div id="modalOtpBadge" class="otp-chip hidden">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span id="modalOtpText"></span>
          </div>
        </div>
        <div id="modalAttachments" class="sheet-attachments hidden"></div>
        <div class="sheet-body">
          <iframe id="modalFrame" sandbox="allow-same-origin"></iframe>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
